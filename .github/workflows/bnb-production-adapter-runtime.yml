name: BNB production adapter runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/bnb-production-adapter-runtime.md'
      - '.github/workflows/bnb-production-adapter-runtime.yml'
  push:
    paths:
      - 'contracts/**'
      - 'docs/bnb-production-adapter-runtime.md'
      - '.github/workflows/bnb-production-adapter-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    name: Compile and exercise BNB production adapters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANVIL_PORT: '8545'
      # The Pancake harness owns 18545. This workflow Anvil is only for the
      # legacy production and mock harnesses and never shares that port.
      ANVIL_LOG: /tmp/bnb-anvil.log
      ANVIL_PID: /tmp/bnb-anvil.pid
      PANCAKE_ADAPTER_LOG: /tmp/pancake-adapter-runtime.log
      PRODUCTION_HARNESS_LOG: /tmp/bnb-production-v1-harness.log
      DIAGNOSTIC_DIR: /tmp/bnb-adapter-runtime-diagnostics
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned harness tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          npm install --prefix "$RUNNER_TEMP/bnb-runtime-deps" \
            --no-package-lock --ignore-scripts --no-audit --no-fund \
            ethers@6 solc@0.8.36
          ln -s "$RUNNER_TEMP/bnb-runtime-deps/node_modules" node_modules

      - name: Install Anvil
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Start isolated Anvil
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAGNOSTIC_DIR"
          anvil --host 127.0.0.1 --port "$ANVIL_PORT" --chain-id 31337 \
            --accounts 10 --balance 10000 --silent >"$ANVIL_LOG" 2>&1 &
          anvil_status=$?
          echo "$!" >"$ANVIL_PID"
          echo "$anvil_status" >"$DIAGNOSTIC_DIR/start-anvil.status"
          ready=1
          for attempt in {1..30}; do
            if curl --max-time 3 --fail --silent --show-error \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              "http://127.0.0.1:${ANVIL_PORT}" | grep -q '0x7a69'; then
              ready=0
              break
            fi
            sleep 1
          done
          echo "$ready" >"$DIAGNOSTIC_DIR/start-anvil-ready.status"
          if [ "$ready" -ne 0 ]; then
            tail -c 200000 "$ANVIL_LOG" >"$DIAGNOSTIC_DIR/start-anvil.log" 2>&1 || true
            echo 'Anvil did not become ready' >&2
            exit 1
          fi

      - name: Compile BNB production contract
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s node contracts/compile-bnb-production.js
          status=$?
          echo "$status" >"$DIAGNOSTIC_DIR/compile-bnb-production.status"
          exit "$status"

      - name: Compile Pancake adapter contracts
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s node contracts/compile-pancake-adapter.js
          status=$?
          echo "$status" >"$DIAGNOSTIC_DIR/compile-pancake-adapter.status"
          exit "$status"

      - name: Run production V1 harness
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            node contracts/bnb-production-v1-harness.mjs 2>&1 | tee "$PRODUCTION_HARNESS_LOG"
          status=${PIPESTATUS[0]}
          echo "$status" >"$DIAGNOSTIC_DIR/production-v1-harness.status"
          exit "$status"

      - name: Run BNB runtime mock tests
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s node contracts/bnb-runtime-mock-test.mjs
          status=$?
          echo "$status" >"$DIAGNOSTIC_DIR/bnb-runtime-mock-test.status"
          exit "$status"

      - name: Make Anvil available to the self-contained harness
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bnb-runtime-bin"
          ln -sf "$(command -v anvil)" "$RUNNER_TEMP/bnb-runtime-bin/anvil"
          sudo mkdir -p /home/team/shared/tools/anvil
          sudo ln -sf "$RUNNER_TEMP/bnb-runtime-bin/anvil" /home/team/shared/tools/anvil/anvil
          status=$?
          echo "$status" >"$DIAGNOSTIC_DIR/install-harness-anvil.status"
          exit "$status"

      - name: Run Pancake adapter runtime tests
        shell: bash
        run: |
          set +e
          # The Pancake harness owns 18545. The workflow Anvil above owns only
          # 8545 for legacy tests, so there is no conflicting workflow Anvil.
          curl --max-time 3 --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            http://127.0.0.1:18545 >/tmp/pancake-port-conflict.json 2>&1
          conflict_probe=$?
          echo "$conflict_probe" >"$DIAGNOSTIC_DIR/pancake-port-probe.status"
          if [ "$conflict_probe" -eq 0 ]; then
            echo 'Pancake harness port 18545 is already serving; refusing shared ownership' >&2
            cat /tmp/pancake-port-conflict.json >&2 || true
            echo 1 >"$DIAGNOSTIC_DIR/pancake-adapter-runtime.status"
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 180s \
            env PANCAKE_ANVIL_PORT=18545 node contracts/pancake-adapter-runtime-test.mjs 2>&1 | tee "$PANCAKE_ADAPTER_LOG"
          status=${PIPESTATUS[0]}
          echo "$status" >"$DIAGNOSTIC_DIR/pancake-adapter-runtime.status"
          exit "$status"

      - name: Capture runtime diagnostics before cleanup
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAGNOSTIC_DIR"
          timeout 5s ps -eo pid,ppid,stat,etime,args --forest >"$DIAGNOSTIC_DIR/ps.txt" 2>&1 || true
          timeout 5s ss -lntp >"$DIAGNOSTIC_DIR/ports.txt" 2>&1 || true
          timeout 5s sh -c 'for p in 8545 18545; do echo "=== RPC $p ==="; curl --max-time 2 --silent --show-error -H "content-type: application/json" --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" "http://127.0.0.1:$p"; echo; done' >"$DIAGNOSTIC_DIR/rpc.txt" 2>&1 || true
          for log in /tmp/*.log /tmp/*.json; do
            [ -f "$log" ] || continue
            name=$(basename "$log")
            tail -c 200000 "$log" >"$DIAGNOSTIC_DIR/$name" 2>&1 || true
          done
          for status in "$DIAGNOSTIC_DIR"/*.status; do
            [ -f "$status" ] || continue
            printf '%s=' "$(basename "$status")" >>"$DIAGNOSTIC_DIR/exit-statuses.txt"
            cat "$status" >>"$DIAGNOSTIC_DIR/exit-statuses.txt"
          done
          : >"$DIAGNOSTIC_DIR/diagnostics-step.status"

      - name: Upload runtime logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnb-production-adapter-runtime-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/bnb-adapter-runtime-diagnostics/**
            /tmp/*.log
            /tmp/*.json
            contracts/**/artifacts/**
            contracts/artifacts/**
            src/contracts/abis/**

      - name: Stop owned Anvil process
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$ANVIL_PID" ]; then
            kill "$(cat "$ANVIL_PID")" 2>/dev/null || true
            for attempt in {1..10}; do
              kill -0 "$(cat "$ANVIL_PID")" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$(cat "$ANVIL_PID")" 2>/dev/null || true
          fi
