# Workflow registration refresh: harmless metadata-only change.
name: BNB Anvil runtime harness

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/BnbSmartChainTestnetBondingCurve.sol'
      - 'contracts/bnb-anvil-runtime-test.mjs'
      - 'contracts/compile-bnb-testnet.js'
      - 'docs/bnb-testnet-evm.md'
      - '.github/workflows/bnb-anvil-runtime.yml'
  pull_request:
    paths:
      - 'contracts/BnbSmartChainTestnetBondingCurve.sol'
      - 'contracts/bnb-anvil-runtime-test.mjs'
      - 'contracts/compile-bnb-testnet.js'
      - 'docs/bnb-testnet-evm.md'
      - '.github/workflows/bnb-anvil-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/bnb-harness-deps" --no-package-lock ethers@6 solc@0.8.36
          ln -s "$RUNNER_TEMP/bnb-harness-deps/node_modules" node_modules

      - name: Install Foundry (stable)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Start Anvil
        shell: bash
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 8545 --chain-id 31337 >"$RUNNER_TEMP/anvil.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/anvil.pid"

      - name: Wait for Anvil RPC
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            chain_id="$(curl --fail --silent --show-error \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result))')" || true
            if [ "$chain_id" = "0x7a69" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/anvil.log"
          echo "Anvil did not report chain ID 31337" >&2
          exit 1

      - name: Compile BNB testnet contracts
        run: node contracts/compile-bnb-testnet.js

      - name: Verify compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            src/contracts/abis/BnbSmartChainTestnetBondingCurve.json \
            src/contracts/abis/BnbSmartChainTestnetTokenFactory.json; do
            test -s "$artifact"
            node -e 'const a=require("./"+process.argv[1]); if (!Array.isArray(a.abi) || !/^0x[0-9a-f]+$/i.test(a.bytecode) || a.bytecode.length <= 100) process.exit(1)' "$artifact"
          done

      - name: Run BNB Anvil runtime harness
        run: timeout --signal=TERM --kill-after=10s 180s node contracts/bnb-anvil-runtime-test.mjs

      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/anvil.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/anvil.pid")" 2>/dev/null || true
            wait "$(cat "$RUNNER_TEMP/anvil.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/anvil.log" ]; then
            cat "$RUNNER_TEMP/anvil.log"
          fi
